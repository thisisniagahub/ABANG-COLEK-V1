name: Vercel Production

# ⚠️ DEPLOYMENT DI-DISABLEkan (22 Okt 2026) — jangan push ke `main` sehingga
# owner sahkan status Vercel Git integration untuk projek `abang-colek-v1`.
#
# SEBAB: steps "Deploy to Vercel Production" menjalankan
#   npx vercel@59.1.3 deploy --prod --yes --scope niaga-hub-pro --project abang-colek-v1
# dan GitHub Actions Vercel Production adalah SATU-SATUNYA laluan deploy
# untuk repo ini. Push ke `main` mencetuskan `vercel deploy --prod` terus
# ke domain production `abangcolek.gangniaga.my`.
#
# Selenium yang masih wujud: checkout → bun install → lint → test → build.
# Trigger `main` sengaja TIDAK ada supaya push tidak sekali-kali mencetuskan
# workflow yang boleh deploy.
#
# Untuk pulihkan deploy: kembalikan `branches: [main]` di bawah, DAN sahkan
# Vercel Git integration untuk projek `abang-colek-v1` (Settings → Git) —
# dua-dua laluan mesti dilumpuhkan sebelum push dikembalikan.

on:
  push:
    branches: [manual-vercel-deploy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test:platform
      - run: bun run build
      - name: Report native Git deployment path
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::No optional VERCEL_TOKEN is configured. Validation ran above; production deployment is handled separately by the Vercel Git integration. Verify the deployment for this exact commit in Vercel."
      - name: Deploy to Vercel Production
        if: env.VERCEL_TOKEN != ''
        run: npx vercel@59.1.3 deploy --prod --yes --scope niaga-hub-pro --project abang-colek-v1 --token "$VERCEL_TOKEN"
